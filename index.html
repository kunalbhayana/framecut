<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framecut — pick the crop, get the numbers</title>
<style>
  :root{
    --ink:#16211f; --accent:#ef714b; --line:#dde5e2;
    --bg:#fbfaf7; --panel:#fff; --muted:#63736f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9eeec; --line:#2c3634; --bg:#141918; --panel:#1b2220; --muted:#94a5a1; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel);
         display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font:700 17px/1.2 system-ui,sans-serif;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 58px)}
  @media (max-width:820px){ .wrap{grid-template-columns:1fr;height:auto} }

  .side{border-right:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  .side .pad{padding:12px}
  .side input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink)}
  .list{overflow:auto;flex:1;padding:0 8px 12px;min-height:120px}
  .list button{display:block;width:100%;text-align:left;border:0;background:none;
    padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;
    color:var(--muted);font-family:inherit;word-break:break-all}
  .list button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
  .list button.on{background:var(--ink);color:var(--bg)}
  .drop{margin:12px;border:1.5px dashed var(--line);border-radius:10px;padding:16px 12px;
        text-align:center;color:var(--muted);font-size:12.5px}
  .drop.hot{border-color:var(--accent);color:var(--ink)}
  .drop label{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline}
  .drop input{display:none}

  .main{padding:18px 22px;overflow:auto;min-height:0}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .controls b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
              min-width:52px}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;
        padding:6px 13px;cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .num{width:74px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
       font-size:12.5px;font-family:inherit;background:var(--bg);color:var(--ink)}

  .stage{position:relative;display:inline-block;max-width:100%;
         border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#e9edeb}
  .stage canvas{display:block;max-width:100%;height:auto}
  .box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);cursor:grab}
  .box.drag{cursor:grabbing}
  .box:before{content:"";position:absolute;inset:0;box-shadow:0 0 0 9999px rgba(10,20,18,.6)}
  .hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}

  .pvTitle,.out h3{margin:18px 0 9px;font:700 10.5px/1 system-ui,sans-serif;
        letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .pvRow{display:flex;flex-wrap:wrap;gap:18px}
  .pv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin:0}
  .pv .slot{overflow:hidden;border-radius:7px;background:#e9edeb}
  .pv .slot img{width:100%;height:100%;display:block}
  .pv figcaption{margin-top:7px;font-size:12px;color:var(--muted)}

  .advice{margin-top:14px;display:grid;gap:8px}
  .note{border-radius:9px;padding:10px 13px;font-size:13.5px;line-height:1.5;
        border:1px solid var(--line);background:var(--panel);display:flex;gap:10px}
  .note .tag{font:700 10px/1.7 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;
             white-space:nowrap;padding:0 8px;border-radius:5px;height:22px}
  .note.ok   .tag{background:#dcefe5;color:#1d6b4f}
  .note.warn .tag{background:#fbe8d8;color:#95501f}
  .note.bad  .tag{background:#f8ded8;color:#9c2d17}
  .note.info .tag{background:#e2eaf3;color:#2c4a72}
  .note b{font-weight:600}

  .out{margin-top:16px;background:var(--panel);border:1px solid var(--line);
       border-left:3px solid var(--accent);border-radius:10px;padding:13px 15px}
  .out code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    padding:11px 13px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .out button{margin-top:10px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;
    padding:9px 16px;cursor:pointer;font:600 13px system-ui,sans-serif}
  .empty{color:var(--muted);padding:36px 0}
  .scan{font-size:12px;color:var(--muted);padding:0 12px 10px}
</style>
</head>
<body>
<header>
  <h1>Framecut</h1>
  <p>Drag the bright area onto what should stay visible, then send the numbers to whoever edits the file.</p>
</header>

<div class="wrap">
  <div class="side">
    <div class="pad"><input id="q" type="search" placeholder="Filter images…" autocomplete="off"></div>
    <p class="scan" id="scan"></p>
    <div class="list" id="list"></div>
    <div class="drop" id="drop">
      Drop images here, or
      <label for="pickFiles">choose files</label> /
      <label for="pickDir">a folder</label>
      <input id="pickFiles" type="file" accept="image/*" multiple>
      <input id="pickDir" type="file" webkitdirectory directory multiple>
    </div>
  </div>

  <div class="main">
    <div class="controls">
      <b>Shape</b>
      <button class="chip on" data-ar="1.3333">4 : 3</button>
      <button class="chip" data-ar="1">square</button>
      <button class="chip" data-ar="1.7778">16 : 9</button>
      <button class="chip" data-ar="0.75">3 : 4</button>
      <button class="chip" data-ar="1.5">3 : 2</button>
      <button class="chip" data-ar="free">free</button>
    </div>

    <div class="controls">
      <b>Zoom</b>
      <input id="zoom" type="range" min="100" max="400" value="100" step="5" style="width:200px">
      <span id="zoomVal" style="font:600 13px system-ui;min-width:46px">100%</span>
      <button class="chip" id="zreset">reset</button>
    </div>

    <div class="controls">
      <b>Rotate</b>
      <button class="chip" data-rot="-1">−1°</button>
      <button class="chip" data-rot="1">+1°</button>
      <input id="rot" type="range" min="-180" max="180" value="0" step="1" style="width:190px">
      <span id="rotVal" style="font:600 13px system-ui;min-width:44px">0°</span>
      <button class="chip" data-rot="-90">−90°</button>
      <button class="chip" data-rot="90">+90°</button>
      <button class="chip" id="rreset">reset</button>
    </div>

    <div class="controls">
      <b>Slot</b>
      <input id="cw" class="num" type="number" min="1" placeholder="width" title="Container width in CSS px">
      <span style="color:var(--muted)">×</span>
      <input id="ch" class="num" type="number" min="1" placeholder="height" title="Container height in CSS px">
      <span style="font-size:12.5px;color:var(--muted)">px — the box this image sits in on your page</span>
    </div>

    <div id="stageWrap"><p class="empty">Add some images on the left to begin.</p></div>
    <p class="hint" id="hint"></p>

    <div id="previewWrap" hidden>
      <h3 class="pvTitle">Live preview — in the container</h3>
      <div class="pvRow" id="pvRow"></div>
    </div>

    <div class="advice" id="advice" hidden></div>

    <div class="out" id="out" hidden>
      <h3>Send this</h3>
      <code id="msg"></code>
      <button id="copy">Copy</button>
    </div>
  </div>
</div>

<script src="./framecut.js"></script>
</body>
</html>
